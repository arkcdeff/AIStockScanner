[project]
name = "ai-stock-scanner"
version = "0.3.0"
description = "Production-ready foundation for an AI-assisted stock scanner"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0.36,<3.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "loguru>=0.7,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "httpx>=0.28,<1.0",
  "pandas-ta>=0.3.14b",
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "jinja2>=3.1,<4.0",
  "openpyxl>=3.1,<4.0",
  "fpdf2>=2.7,<3.0",
  "APScheduler>=3.10,<4.0",
  "argon2-cffi>=23.1,<26.0",
  "pyjwt>=2.10,<3.0",
  "typer>=0.12,<1.0",
  "protobuf>=7.36.0",
  "grpcio-tools>=1.83.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001"]
"tests/*" = ["E501"]
