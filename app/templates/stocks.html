{% extends "layouts/shell.html" %}
{% block title %}Stocks - AI Stock Scanner{% endblock %}
{% block page_title %}Stock Analysis{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Stock Analysis</h1>
        <p class="page-subtitle">Browse and analyze stocks in your database</p>
    </div>
</div>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-building me-1"></i> Stocks</span>
        <form class="d-flex" hx-get="/stocks/table" hx-target="#stocks-table" hx-swap="innerHTML" hx-trigger="submit">
            <input type="text" class="form-control form-control-sm me-2" name="q" placeholder="Search symbol or name..." hx-get="/stocks/table" hx-trigger="keyup changed delay:400ms" hx-target="#stocks-table" hx-params="q">
            <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-search"></i></button>
        </form>
    </div>
    <div class="card-body">
        <div id="stocks-table">
            {% include "components/stocks_table.html" %}
        </div>
    </div>
</div>
{% endblock %}
