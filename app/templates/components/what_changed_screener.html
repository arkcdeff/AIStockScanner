<div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
        <h5 class="mb-0">
            <i class="bi bi-funnel me-2 text-primary"></i>What Changed Universe Screener
            <span class="badge bg-info text-dark ms-2">G.11-D-4</span>
        </h5>
        <span class="text-muted small">Multi-Stock Cross-Domain Opportunity Screening</span>
    </div>
    <div class="card-body">
        <form id="what-changed-screening-form"
              hx-post="/stocks/screening/what-changed"
              hx-target="#screening-results-area"
              hx-swap="innerHTML"
              class="row g-3">
            
            <div class="col-md-3">
                <label for="universeSelect" class="form-label fw-semibold">Universe</label>
                <select id="universeSelect" name="universe" class="form-select">
                    <option value="NIFTY_50" selected>NIFTY 50</option>
                    <option value="NIFTY_NEXT_50">NIFTY NEXT 50</option>
                    <option value="NIFTY_MIDCAP_100">NIFTY MIDCAP 100</option>
                    <option value="NIFTY_BANK">NIFTY BANK</option>
                    <option value="FNO">F&amp;O Universe</option>
                    <option value="WATCHLIST">Watchlist</option>
                </select>
            </div>

            <div class="col-md-2" id="watchlistGroup" style="display: none;">
                <label for="watchlistId" class="form-label fw-semibold">Watchlist ID</label>
                <input type="number" id="watchlistId" name="watchlist_id" class="form-control" placeholder="ID">
            </div>

            <div class="col-md-3">
                <label for="asOfDate" class="form-label fw-semibold">As Of Date</label>
                <input type="date" id="asOfDate" name="as_of_date" class="form-control">
            </div>

            <div class="col-md-2">
                <label for="comparisonWindow" class="form-label fw-semibold">Window (Days)</label>
                <input type="number" id="comparisonWindow" name="comparison_window" class="form-control" value="1" min="1" max="30">
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-play-circle me-1"></i>Run Screen
                </button>
            </div>

            <div class="col-12">
                <div class="collapse" id="advancedFilterCollapse">
                    <div class="card card-body bg-light border-0 mt-2">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Overall State Filter</label>
                                <select name="filter_criteria[overall_states]" class="form-select form-select-sm" multiple size="3">
                                    <option value="BULLISH_EVIDENCE_SUPPORTED">BULLISH EVIDENCE SUPPORTED</option>
                                    <option value="BEARISH_EVIDENCE_SUPPORTED">BEARISH EVIDENCE SUPPORTED</option>
                                    <option value="PARTIALLY_SUPPORTED_BULLISH_BIAS">PARTIALLY SUPPORTED BULLISH</option>
                                    <option value="PARTIALLY_SUPPORTED_BEARISH_BIAS">PARTIALLY SUPPORTED BEARISH</option>
                                    <option value="MIXED_EVIDENCE">MIXED EVIDENCE</option>
                                    <option value="NEUTRAL_OBSERVATION">NEUTRAL OBSERVATION</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">Directional Bias</label>
                                <select name="filter_criteria[directional_biases]" class="form-select form-select-sm" multiple size="3">
                                    <option value="BULLISH_EVIDENCE">BULLISH EVIDENCE</option>
                                    <option value="BEARISH_EVIDENCE">BEARISH EVIDENCE</option>
                                    <option value="MIXED">MIXED</option>
                                    <option value="NEUTRAL">NEUTRAL</option>
                                    <option value="NO_DIRECTIONAL_SIGNAL">NO DIRECTIONAL SIGNAL</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small fw-bold">Min Convergence</label>
                                <input type="number" name="filter_criteria[min_convergence_ratio]" class="form-control form-control-sm" step="0.05" min="0" max="1" placeholder="e.g. 0.50">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">Custom Symbols (CSV)</label>
                                <input type="text" name="symbols_csv" class="form-control form-control-sm" placeholder="e.g. INFY, TCS, RELIANCE">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-2 text-end">
                    <a class="small text-decoration-none" data-bs-toggle="collapse" href="#advancedFilterCollapse" role="button" aria-expanded="false" aria-controls="advancedFilterCollapse">
                        <i class="bi bi-sliders me-1"></i>Toggle Filter Criteria
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

<div id="screening-results-area" aria-live="polite">
    {% include "components/what_changed_screening_results.html" %}
</div>

<script>
    document.getElementById('universeSelect')?.addEventListener('change', function(e) {
        const wlGroup = document.getElementById('watchlistGroup');
        if (wlGroup) {
            wlGroup.style.display = e.target.value === 'WATCHLIST' ? 'block' : 'none';
        }
    });
</script>
