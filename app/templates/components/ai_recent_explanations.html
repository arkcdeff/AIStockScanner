{% if recent %}
<ul class="list-group list-group-flush">
    {% for item in recent %}
    <li class="list-group-item">
        <div class="d-flex justify-content-between align-items-center">
            <a href="/stocks/{{ item.symbol }}" class="text-decoration-none fw-semibold">{{ item.symbol }}</a>
            <span class="badge bg-primary">{{ item.confidence if item.confidence is not none else '—' }}</span>
        </div>
        <div class="small text-muted">{{ item.trade_date }} · {{ item.provider }}</div>
    </li>
    {% endfor %}
</ul>
{% else %}
<div class="text-muted small">No AI explanations generated yet.</div>
{% endif %}
