{% set current_path = request.url.path if request is defined else '' %}
<div class="sidebar" id="sidebar">
    <div class="position-sticky">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {{ 'active' if current_path in ['/', '/dashboard'] else '' }}" href="/dashboard">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-table me-2"></i>Market Data
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-bar-chart me-2"></i>Indicators
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-search me-2"></i>Scanners
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if current_path.startswith('/scanner-results') else '' }}" href="/scanner-results">
                    <i class="bi bi-list-check me-2"></i>Scanner Results
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-building me-2"></i>Stocks
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if current_path.startswith('/watchlists') else '' }}" href="/watchlists">
                    <i class="bi bi-star me-2"></i>Watchlists
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if current_path.startswith('/portfolio') else '' }}" href="/portfolio">
                    <i class="bi bi-briefcase me-2"></i>Portfolio
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if current_path.startswith('/alerts') else '' }}" href="/alerts">
                    <i class="bi bi-bell me-2"></i>Alerts
                </a>
            </li>
            <li class="nav-item mt-2">
                <a class="nav-link {{ 'active' if current_path in ['/notifications', '/notifications/'] else '' }}" href="/notifications">
                    <i class="bi bi-bell-fill me-2"></i>Notifications
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if current_path == '/notifications/settings' else '' }}" href="/notifications/settings">
                    <i class="bi bi-sliders me-2"></i>Notification Settings
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {{ 'active' if current_path.startswith('/notifications/history') else '' }}" href="/notifications/history">
                    <i class="bi bi-clock-history me-2"></i>Notification History
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-file-earmark-text me-2"></i>Reports
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">
                    <i class="bi bi-gear me-2"></i>Settings
                </a>
            </li>
        </ul>
    </div>
</div>
