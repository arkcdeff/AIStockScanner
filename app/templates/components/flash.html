{% if flash %}
<div class="alert alert-{{ flash.get('level', 'info') }} alert-dismissible fade show" role="alert" style="border-radius:var(--radius-lg);font-size:var(--font-size-sm);">
    {{ flash.get('message', '') }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endif %}
