{% set current_path = request.url.path if request is defined else '' %}
<div class="topbar-left">
    <button class="topbar-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
    </button>
    <button class="topbar-btn d-none d-lg-flex" type="button" onclick="toggleSidebar()" aria-label="Toggle sidebar" id="sidebarToggle">
        <i class="bi" id="sidebarToggleIcon"></i>
    </button>
    <div class="topbar-breadcrumb">
        <span class="topbar-page-title" id="pageTitle">{% block page_title %}{% endblock %}</span>
    </div>
</div>
<div class="topbar-right">
    <div class="topbar-status d-none d-md-flex" id="dataFreshness">
        {% block topbar_status %}{% endblock %}
    </div>
    <button class="topbar-btn" type="button" onclick="toggleTheme()" aria-label="Toggle theme" id="themeToggle">
        <i class="bi" id="themeIcon"></i>
    </button>
    {% if browser_user %}
    <div class="dropdown">
        <button class="topbar-btn topbar-user-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span class="topbar-avatar">{{ browser_user.user.username[:1]|upper }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><span class="dropdown-item-text text-muted small">{{ browser_user.user.email }}</span></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
            <li><a class="dropdown-item" href="/settings"><i class="bi bi-sliders me-2"></i>Settings</a></li>
            <li><a class="dropdown-item" href="/sessions"><i class="bi bi-phone me-2"></i>Sessions</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <form method="post" action="/logout">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token or '' }}">
                    <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                </form>
            </li>
        </ul>
    </div>
    {% endif %}
</div>
