<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<div class="card mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h5 class="mb-0"><i class="bi bi-graph-up me-2"></i>Price Chart</h5>
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary chart-period-btn" data-period="1m" onclick="changePeriod('1m')">1M</button>
            <button class="btn btn-outline-secondary chart-period-btn" data-period="3m" onclick="changePeriod('3m')">3M</button>
            <button class="btn btn-outline-secondary chart-period-btn" data-period="6m" onclick="changePeriod('6m')">6M</button>
            <button class="btn btn-primary chart-period-btn" data-period="1y" onclick="changePeriod('1y')">1Y</button>
            <button class="btn btn-outline-secondary chart-period-btn" data-period="3y" onclick="changePeriod('3y')">3Y</button>
            <button class="btn btn-outline-secondary chart-period-btn" data-period="5y" onclick="changePeriod('5y')">5Y</button>
            <button class="btn btn-outline-secondary chart-period-btn" data-period="all" onclick="changePeriod('all')">All</button>
            <button class="btn btn-outline-success" id="toggle-indicators" onclick="toggleIndicators()">Indicators</button>
        </div>
    </div>
    <div class="card-body position-relative" style="min-height: 450px;">
        <div id="chart-loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Loading chart data...</p>
        </div>
        <div id="chart-error" class="text-center py-5" style="display: none;">
            <p class="text-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>Failed to load chart data. Please try refreshing.</p>
        </div>
        <div id="chart-empty" class="text-center py-5" style="display: none;">
            <p class="text-muted"><i class="bi bi-info-circle me-2"></i>No price data available for this timeframe.</p>
        </div>
        <div id="chart-container" style="height: 420px; width: 100%; display: none;"></div>
    </div>
</div>

<script>
    (function() {
        let chart = null;
        let candleSeries = null;
        let volumeSeries = null;
        let ema20Series = null;
        let ema50Series = null;
        let ema200Series = null;
        let currentPeriod = '1y';
        let includeIndicators = true;

        function getChartLibrary() {
            if (window.LightweightCharts) {
                return window.LightweightCharts;
            }
            return null;
        }

        function initChart() {
            const container = document.getElementById('chart-container');
            const lib = getChartLibrary();
            if (!container || !lib || chart) return;

            container.style.display = 'block';

            chart = lib.createChart(container, {
                width: container.clientWidth || 700,
                height: 420,
                layout: {
                    background: { type: lib.ColorType.Solid, color: '#ffffff' },
                    textColor: '#333333',
                },
                grid: {
                    vertLines: { color: '#f0f0f0' },
                    horzLines: { color: '#f0f0f0' },
                },
                crosshair: {
                    mode: lib.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: '#e0e0e0',
                },
                timeScale: {
                    borderColor: '#e0e0e0',
                    timeVisible: true,
                    secondsVisible: false,
                },
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#22c55e',
                downColor: '#ef4444',
                borderVisible: false,
                wickUpColor: '#22c55e',
                wickDownColor: '#ef4444',
            });

            volumeSeries = chart.addHistogramSeries({
                color: '#22c55e',
                priceFormat: { type: 'volume' },
                priceScaleId: '',
            });
            volumeSeries.priceScale().applyOptions({
                scaleMargins: { top: 0.8, bottom: 0 },
            });

            ema20Series = chart.addLineSeries({ color: '#2196F3', lineWidth: 2, title: 'EMA 20' });
            ema50Series = chart.addLineSeries({ color: '#FF9800', lineWidth: 2, title: 'EMA 50' });
            ema200Series = chart.addLineSeries({ color: '#F44336', lineWidth: 2, title: 'EMA 200' });
        }

        async function loadChart(period, showIndicators) {
            const container = document.getElementById('chart-container');
            const loading = document.getElementById('chart-loading');
            const error = document.getElementById('chart-error');
            const empty = document.getElementById('chart-empty');

            if (loading) loading.style.display = 'block';
            if (error) error.style.display = 'none';
            if (empty) empty.style.display = 'none';

            try {
                const url = `/stocks/{{ symbol }}/chart-data?period=${period}&include_indicators=${showIndicators}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch chart data');
                const data = await response.json();

                if (!data.candles || data.candles.length === 0) {
                    if (loading) loading.style.display = 'none';
                    if (container) container.style.display = 'none';
                    if (empty) empty.style.display = 'block';
                    return;
                }

                if (container) container.style.display = 'block';

                if (!chart) {
                    initChart();
                }

                if (!chart) {
                    throw new Error('Chart library not initialized');
                }

                candleSeries.setData(data.candles);
                volumeSeries.setData(data.volume || []);

                if (showIndicators) {
                    ema20Series.setData(data.ema20 || []);
                    ema50Series.setData(data.ema50 || []);
                    ema200Series.setData(data.ema200 || []);
                    ema20Series.applyOptions({ visible: true });
                    ema50Series.applyOptions({ visible: true });
                    ema200Series.applyOptions({ visible: true });
                } else {
                    ema20Series.applyOptions({ visible: false });
                    ema50Series.applyOptions({ visible: false });
                    ema200Series.applyOptions({ visible: false });
                }

                if (data.scanner_markers && data.scanner_markers.length > 0) {
                    chart.applyOptions({
                        markers: data.scanner_markers.map(m => ({
                            time: m.time,
                            position: m.position,
                            color: m.color,
                            shape: m.shape,
                            text: m.text,
                        })),
                    });
                }

                chart.timeScale().fitContent();
                if (loading) loading.style.display = 'none';
            } catch (err) {
                console.error("Chart load error:", err);
                if (loading) loading.style.display = 'none';
                if (container) container.style.display = 'none';
                if (error) error.style.display = 'block';
            }
        }

        window.changePeriod = function(period) {
            currentPeriod = period;
            document.querySelectorAll('.chart-period-btn').forEach(btn => {
                if (btn.getAttribute('data-period') === period) {
                    btn.classList.remove('btn-outline-secondary');
                    btn.classList.add('btn-primary');
                } else {
                    btn.classList.remove('btn-primary');
                    btn.classList.add('btn-outline-secondary');
                }
            });
            loadChart(period, includeIndicators);
        };

        window.toggleIndicators = function() {
            includeIndicators = !includeIndicators;
            const btn = document.getElementById('toggle-indicators');
            if (btn) {
                if (includeIndicators) {
                    btn.classList.remove('btn-outline-secondary');
                    btn.classList.add('btn-outline-success');
                } else {
                    btn.classList.remove('btn-outline-success');
                    btn.classList.add('btn-outline-secondary');
                }
            }
            loadChart(currentPeriod, includeIndicators);
        };

        function startLoad() {
            loadChart(currentPeriod, includeIndicators);
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(startLoad, 50);
        } else {
            document.addEventListener('DOMContentLoaded', startLoad);
        }

        window.addEventListener('resize', function() {
            if (chart) {
                const container = document.getElementById('chart-container');
                if (container) {
                    chart.applyOptions({
                        width: container.clientWidth || 700,
                    });
                }
            }
        });
    })();
</script>
