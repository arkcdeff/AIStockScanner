<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Stock Scanner{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/design-system.css" rel="stylesheet">
    <link href="/static/css/dashboard.css" rel="stylesheet">
    <link href="/static/css/auth.css" rel="stylesheet">
    {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body data-bs-theme="{{ body_theme or 'light' }}">
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/shell.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script>
        (function () {
            var token = document.querySelector('meta[name="csrf-token"]');
            if (!token || !window.htmx) return;
            document.body.addEventListener('htmx:configRequest', function (evt) {
                evt.detail.headers['x-csrf-token'] = token.getAttribute('content');
            });
        })();
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
