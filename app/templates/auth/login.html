{% extends "base.html" %}

{% block title %}Sign in - AI Stock Scanner{% endblock %}

{% block body %}
<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
    <div class="card auth-card shadow-sm">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-graph-up-arrow display-5 text-primary"></i>
                <h1 class="h4 mt-2 mb-0">AI Stock Scanner</h1>
                <p class="text-muted mb-0">Sign in to your account</p>
            </div>

            {% if expired_message %}
            <div class="alert alert-warning" role="alert">{{ expired_message }}</div>
            {% endif %}
            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login" novalidate>
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label for="username_or_email" class="form-label">Username or email</label>
                    <input type="text" class="form-control" id="username_or_email" name="username_or_email"
                           autocomplete="username" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button" id="toggle-password" tabindex="-1">
                            <i class="bi bi-eye" id="toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me" value="on">
                    <label class="form-check-label" for="remember_me">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    (function () {
        var toggle = document.getElementById('toggle-password');
        var password = document.getElementById('password');
        var icon = document.getElementById('toggle-icon');
        if (!toggle || !password || !icon) return;
        toggle.addEventListener('click', function () {
            var show = password.type === 'password';
            password.type = show ? 'text' : 'password';
            icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
            toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
        });
    })();
</script>
{% endblock %}
