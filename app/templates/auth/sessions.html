{% extends "layouts/shell.html" %}
{% block title %}Sessions - AI Stock Scanner{% endblock %}
{% block page_title %}Sessions{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1>Sessions</h1><p class="page-subtitle">Active login sessions</p></div>
    <form method="post" action="/sessions/revoke-all">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Sign out all sessions?')"><i class="bi bi-box-arrow-right me-1"></i>Revoke All</button>
    </form>
</div>

<div class="card">
    <div class="card-body">{% include "auth/components/sessions_table.html" %}</div>
</div>
{% endblock %}
