{% include "components/flash.html" %}
<div class="card">
    <div class="card-header bg-white">
        <h5 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Change password</h5>
    </div>
    <div class="card-body">
        <form method="post" action="/password/change" hx-post="/password/change" hx-target="#password-form" hx-swap="innerHTML">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <label for="current_password" class="form-label">Current password</label>
                <input type="password" class="form-control" id="current_password" name="current_password"
                       autocomplete="current-password" required>
            </div>
            <div class="mb-3">
                <label for="new_password" class="form-label">New password</label>
                <input type="password" class="form-control" id="new_password" name="new_password"
                       autocomplete="new-password" required>
                <div class="form-text">At least 12 characters including uppercase, lowercase, a digit and a symbol.</div>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm new password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                       autocomplete="new-password" required>
            </div>
            <div class="alert alert-info py-2 small">
                Changing your password signs out all your other sessions, including this one.
            </div>
            <button type="submit" class="btn btn-warning">Change password</button>
        </form>
    </div>
</div>
