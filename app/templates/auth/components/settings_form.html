{% include "components/flash.html" %}
<div class="card">
    <div class="card-header bg-white">
        <h5 class="mb-0"><i class="bi bi-sliders me-2"></i>Preferences</h5>
    </div>
    <div class="card-body">
        <form method="post" action="/preferences/update" hx-post="/preferences/update" hx-target="#settings-form" hx-swap="innerHTML">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
                <label for="theme" class="form-label">Theme</label>
                <select class="form-select" id="theme" name="theme">
                    {% for option in ['system', 'light', 'dark'] %}
                    <option value="{{ option }}" {{ 'selected' if preference.theme == option else '' }}>{{ option|capitalize }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="timezone" class="form-label">Timezone</label>
                <input type="text" class="form-control" id="timezone" name="timezone" list="timezone-options"
                       value="{{ preference.timezone }}" maxlength="64">
                <datalist id="timezone-options">
                    <option value="Asia/Kolkata">
                    <option value="Asia/Dubai">
                    <option value="UTC">
                    <option value="America/New_York">
                    <option value="Europe/London">
                </datalist>
                <div class="form-text">Use an IANA timezone name such as Asia/Kolkata.</div>
            </div>
            <div class="mb-3">
                <label for="language" class="form-label">Language</label>
                <input type="text" class="form-control" id="language" name="language" value="{{ preference.language }}"
                       maxlength="16">
                <div class="form-text">Locale code such as en or hi.</div>
            </div>
            <button type="submit" class="btn btn-primary">Save preferences</button>
        </form>
    </div>
</div>
