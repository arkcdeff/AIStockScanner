{% extends "layouts/shell.html" %}
{% block title %}Permissions - AI Stock Scanner{% endblock %}
{% block page_title %}Permissions{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Permissions</h1>
        <p class="page-subtitle">Manage system permissions</p>
    </div>
    <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#createPermModal"><i class="bi bi-plus me-1"></i>Create Permission</button>
</div>

<div class="card">
    <div class="card-body">
        <div id="permissions-table">{% include "admin/components/permissions_table.html" %}</div>
    </div>
</div>

<div class="modal fade" id="createPermModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Create Permission</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form method="post" action="/admin/permissions/create" hx-post="/admin/permissions/create" hx-target="#permissions-table" hx-swap="innerHTML">
        <div class="modal-body">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3"><label class="form-label">Code</label><input type="text" class="form-control" name="code" required></div>
            <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" name="name" required></div>
            <div class="mb-3"><label class="form-label">Description</label><input type="text" class="form-control" name="description"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-sm btn-primary">Create</button></div>
    </form>
</div></div></div>
{% endblock %}
