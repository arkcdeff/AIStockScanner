{% extends "layouts/app.html" %}

{% block title %}Users - Admin - AI Stock Scanner{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Users</h1>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createUserModal">
        <i class="bi bi-person-plus me-1"></i>New user
    </button>
</div>

<form class="row g-2 mb-3 align-items-end" hx-get="/admin/users/table" hx-target="#users-table" hx-swap="innerHTML"
      hx-trigger="submit, keyup changed delay:400ms from:[name=search]">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <div class="col-md-4">
        <label for="search" class="form-label">Search</label>
        <input type="text" class="form-control" id="search" name="search" value="{{ params.search or '' }}"
               placeholder="Username or email">
    </div>
    <div class="col-md-2">
        <label for="is_active" class="form-label">Status</label>
        <select class="form-select" id="is_active" name="is_active">
            <option value="">All</option>
            <option value="true" {{ 'selected' if params.is_active is true else '' }}>Active</option>
            <option value="false" {{ 'selected' if params.is_active is false else '' }}>Inactive</option>
        </select>
    </div>
    <div class="col-md-2">
        <label for="is_verified" class="form-label">Verified</label>
        <select class="form-select" id="is_verified" name="is_verified">
            <option value="">All</option>
            <option value="true" {{ 'selected' if params.is_verified is true else '' }}>Verified</option>
        </select>
    </div>
    <div class="col-md-2">
        <label for="role_id" class="form-label">Role</label>
        <select class="form-select" id="role_id" name="role_id">
            <option value="">All</option>
            {% for r in roles %}
            <option value="{{ r.role.id }}" {{ 'selected' if params.role_id == r.role.id else '' }}>{{ r.role.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-outline-primary">Filter</button>
    </div>
</form>

<div id="users-table">
    {% include "admin/components/users_table.html" %}
</div>

<div class="modal fade" id="createUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" action="/admin/users/create" hx-post="/admin/users/create"
                  hx-target="#users-table" hx-swap="innerHTML">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                <div class="modal-header">
                    <h5 class="modal-title">New user</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Full name</label>
                        <input type="text" class="form-control" name="full_name">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                        <div class="form-text">Min 12 chars incl. uppercase, lowercase, digit and symbol.</div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Roles</label>
                        <select class="form-select" name="role_ids" multiple size="4">
                            {% for r in roles %}
                            <option value="{{ r.role.id }}">{{ r.role.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_verified" id="nu_verified" value="on">
                        <label class="form-check-label" for="nu_verified">Verified</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_superuser" id="nu_super" value="on">
                        <label class="form-check-label" for="nu_super">Superuser</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
