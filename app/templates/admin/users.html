{% extends "layouts/shell.html" %}
{% block title %}Users - AI Stock Scanner{% endblock %}
{% block page_title %}Users{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Users</h1>
        <p class="page-subtitle">Manage user accounts</p>
    </div>
    <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#createUserModal"><i class="bi bi-plus me-1"></i>Create User</button>
</div>

<div class="card">
    <div class="card-body">
        <div id="users-table">{% include "admin/components/users_table.html" %}</div>
    </div>
</div>

<div class="modal fade" id="createUserModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Create User</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form method="post" action="/admin/users/create" hx-post="/admin/users/create" hx-target="#users-table" hx-swap="innerHTML">
        <div class="modal-body">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <div class="mb-3"><label class="form-label">Username</label><input type="text" class="form-control" name="username" required></div>
            <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
            <div class="mb-3"><label class="form-label">Full Name</label><input type="text" class="form-control" name="full_name"></div>
            <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-sm btn-primary">Create</button></div>
    </form>
</div></div></div>
{% endblock %}
