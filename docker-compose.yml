services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ai_stock_scanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_stock_scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@db:5432/ai_stock_scanner
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@db:5432/ai_stock_scanner
    ports:
      - "8000:8000"
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
